name: Update data.json

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Weekly: every Monday 03:00 UTC (= Mon 12:00 JST)
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data.json
        id: build
        run: python scripts/build.py --out data.json

      - name: Show summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Packs: **${{ steps.build.outputs.pack_count }}**" >> $GITHUB_STEP_SUMMARY
          echo "- ☆12 Charts: **${{ steps.build.outputs.chart_count }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Changed: **${{ steps.build.outputs.changed }}**" >> $GITHUB_STEP_SUMMARY

      - name: Commit changes
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "chore: auto-update data.json ($(date -u +%Y-%m-%d))"
          git push
